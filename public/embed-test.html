<!doctype html><meta charset="utf-8"><title>embed harness</title>
<!--
  Reproduces the ArcGIS Experience Builder Embed widget's sandbox so embedded
  behaviour can be checked without deploying to EB first. EB grants only
  allow-scripts and allow-same-origin: no allow-downloads, no allow-popups.

  ?item=CSV | GeoJSON | Report   which export to open (default CSV)
-->
<style>html,body{margin:0;height:100%;background:#111}iframe{width:100%;height:100%;border:0}</style>
<iframe id="f" sandbox="allow-scripts allow-same-origin"
        src="./#at=-1.95400,30.09300,16.5"></iframe>
<script>
const item = new URLSearchParams(location.search).get('item') || 'CSV';
const f = document.getElementById('f');
const find = (d, sel, text) =>
  [...d.querySelectorAll(sel)].find(e => e.textContent.trim().startsWith(text));
let tries = 0;
const tick = () => {
  tries++;
  const d = f.contentDocument;
  if (d) {
    const target = find(d, '.exportdrop button', item);
    if (target && !target.disabled) { target.click(); return; }
    if (!d.querySelector('.exportdrop')) find(d, 'button', 'Export')?.click();
  }
  if (tries < 120) setTimeout(tick, 400);
};
setTimeout(tick, 1500);
</script>
