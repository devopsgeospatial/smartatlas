<!doctype html><meta charset="utf-8"><title>embed harness</title>
<style>html,body{margin:0;height:100%;background:#111}iframe{width:100%;height:100%;border:0}</style>
<!-- Same sandbox Experience Builder applies: scripts + same-origin, no downloads, no popups. -->
<iframe id="f" sandbox="allow-scripts allow-same-origin"
        src="./#at=-1.95400,30.09300,16.5"></iframe>
<script>
const f = document.getElementById('f');
const find = (d, sel, text) =>
  [...d.querySelectorAll(sel)].find(e => e.textContent.trim().startsWith(text));
let tries = 0;
const tick = () => {
  tries++;
  const d = f.contentDocument;
  if (d) {
    const openBtn = find(d, 'button', 'Export');
    const csv = find(d, '.exportdrop button', 'CSV');
    if (csv && !csv.disabled) { csv.click(); return; }
    if (openBtn && !d.querySelector('.exportdrop')) openBtn.click();
  }
  if (tries < 120) setTimeout(tick, 400);
};
setTimeout(tick, 1500);
</script>
